kind = "web"
previewPath = "/"
title = "ConnectAI"
description = "A real-time messaging and AI mock-interview platform for students preparing for placements. Users can connect with registered peers, practice role-based interviews, review personalized AI feedback, and track progress."
version = "1.0.0"
id = "artifacts/connectai"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25567

[services.development]
run = "pnpm --filter @workspace/connectai run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/connectai", "run", "build" ]
serve = "static"
publicDir = "artifacts/connectai/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25567"
BASE_PATH = "/"
